<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Каталог товаров</title>
  <link rel="preload" href="fonts/georgia.ttf" as="font"
        type="font/ttf">

  <link rel="stylesheet" href="style.css">
</head>
<body>
<style>
      @font-face {
      font-family: "MyFont";
      src: url("fonts/georgia.ttf") format("truetype");
      font-display: swap;
    }

  * {
  box-sizing: border-box;
}

:root {
  --bg: #e38ce6;
  --card: #ffffff;
  --text: #333;
  --price: #2c6e2f;
  --muted: #777777;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
}

h1 {
  text-align: center;
}

header {
  text-align: center;
  margin-bottom: 10px;
}

#catalog-count {
  display: block;
  font-weight: 600;
  color: var(--muted);
  margin-top: 6px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 20px;
}

.card {
  background: var(--card);
  border-radius: 8px;
  padding: 12px;
  border: 1px solid #e436cd;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
}

.card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  border-radius: 6px;
}

.card h2 {
  font-size: 1.05rem;
  margin: 8px 0;
}


.card button {
  display: inline-block;
  margin-top: 6px;
  padding: 8px 12px;
  border: 1px solid #eb63a3;
  border-radius: 6px;
  background: #80d2eb;
  cursor: pointer;
}
.card button:hover {
  background: #ee559d;
}
.search {
      display: block;
      width: 100%;
      max-width: 400px;
      margin: 0 auto 20px;
      padding: 10px;
      font-size: 16px;
    }
 
.stats {
      position: fixed;
      right: 10px;
      bottom: 10px;
      padding: 10px 14px;
      background: #1f4e79;
      color: #ffffff;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
    }
 
    .more {
      display: block;
      margin: 30px auto;
      padding: 12px 24px;
      font-size: 16px;
    }
 

.up {
      position: fixed;
      left: 10px;
      bottom: 10px;
      padding: 10px 14px;
      display: none;
    }


</style>
  <link rel="stylesheet" href="style.css"
        media="print" onload="this.media='all'">
<noscript>
    <link rel="stylesheet" href="style.css">
  </noscript>

  <header style="text-align:center;">
    <h1>Каталог товаров</h1>
    <p id="total"></p>
    <p id="clock"></p>

    <input class="search" id="search" placeholder="Поиск по названию">
 
  <div class="stats">
    <div id="filterRuns">Поиск запускался: 0</div>
    <div id="scrollRuns">Прокрутка обработана: 0</div>
    <div id="handlers">Обработчиков кнопок: 0</div>
    <div id="cart">В корзине: 0</div>
    <div id="nodes">Элементов на странице: 0</div>
    <div id="fromCache">Из кеша: 0 из 0</div>
    <div id="loaded">Скачано: 0 кБ</div>
  </div>
 
  <button class="up" id="up">Наверх</button>
 

    <h2 id="catalog-count">Всего в каталоге: 0</h2>
  </header>

  <main class="cards">

  </main>

    <button class="more" id="more">Показать ещё</button>

  <script src="script.js"></script>
</body>
</html>
